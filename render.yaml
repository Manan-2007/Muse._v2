# Backend blueprint for Render (render.com) — the Express + Socket.io server.
#
# The realtime server needs a long-running process with WebSockets, which
# Vercel's serverless functions can't host, so the API lives here and the
# React frontend lives on Vercel. See DEPLOY.md.
services:
  - type: web
    name: muse-api
    runtime: node
    rootDir: server
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: '20'
      # The Neon (or other) Postgres connection string — paste in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Signs session tokens. Render generates a strong one on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # The frontend origin, for CORS. Set to the Vercel URL after the frontend
      # is deployed, e.g. https://muse-v2.vercel.app (no trailing slash).
      - key: CLIENT_ORIGIN
        sync: false
      # Frontend and API are on different origins, so the session cookie must be
      # SameSite=None; Secure — this flips it. Both ends are HTTPS in production.
      - key: CROSS_SITE
        value: 'true'
      # Optional — only YouTube search needs it; pasting links works without one.
      - key: YOUTUBE_API_KEY
        sync: false
